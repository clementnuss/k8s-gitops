---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
  namespace: kube-spegel
spec:
  interval: 5m
  chart:
    spec:
      chart: spegel
      version: 0.7.4
      sourceRef:
        kind: HelmRepository
        name: spegel
        namespace: flux-system
      interval: 5m
  values:
    spegel:
      # Talos uses a different containerd registry config path.
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
      # Only share blobs; do not resolve tags to digests.
      resolveTags: false
      # Resource limit for the stateful DaemonSet workload.
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 512Mi
