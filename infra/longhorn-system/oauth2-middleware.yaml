---
# reference as: appl-n8r-oauth2-longhorn@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-longhorn
  namespace: appl-n8r
spec:
  forwardAuth:
    address: "https://auth.n8r.ch/oauth2/auth"
    authSigninURL: "https://auth.n8r.ch/oauth2/start?rd=https://longhorn.n8r.ch/"
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
      - X-Auth-Request-Name
    maxResponseBodySize: 10485760  # 10MiB