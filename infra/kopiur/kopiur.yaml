---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
  namespace: appl-kopiur
spec:
  interval: 5m
  chart:
    spec:
      chart: kopiur
      version: 0.10.16
      sourceRef:
        kind: HelmRepository
        name: kopiur
        namespace: flux-system
      interval: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # defaults are sane: replicaCount 1, leader election on, no mem limit on the
  # controller by design (startup reconcile burst OOMs under a low ceiling)
  values: {}