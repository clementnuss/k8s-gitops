---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: versitygw-secret
  namespace: appl-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: versitygw-secret
    creationPolicy: Owner
  data:
  - secretKey: ROOT_ACCESS_KEY_ID
    remoteRef:
      key: k8s/appl-s3/versitygw
      property: access_key
  - secretKey: ROOT_SECRET_ACCESS_KEY
    remoteRef:
      key: k8s/appl-s3/versitygw
      property: secret_key
---
# versitygw internal IAM file, built from one OpenBao entry where each
# property is <access key>=<secret key>. Read-only mount: no out-of-band users.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: versitygw-users
  namespace: appl-s3
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: versitygw-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        users.json: |
          {{- $accts := dict -}}
          {{- range $access, $secret := . -}}
          {{- $_ := set $accts $access (dict "access" $access "secret" $secret "role" "userplus" "userID" 0 "groupID" 0 "projectID" 0) -}}
          {{- end -}}
          {{ dict "accessAccounts" $accts | toJson }}
  dataFrom:
  - extract:
      key: k8s/appl-s3/users
