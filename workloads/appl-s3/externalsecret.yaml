---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: versitygw-secret
  namespace: appl-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: versitygw-secret
    creationPolicy: Owner
  data:
  - secretKey: ROOT_ACCESS_KEY_ID
    remoteRef:
      key: k8s/appl-s3/versitygw
      property: access_key
  - secretKey: ROOT_SECRET_ACCESS_KEY
    remoteRef:
      key: k8s/appl-s3/versitygw
      property: secret_key
