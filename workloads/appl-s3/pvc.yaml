---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-data-nfs
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  mountOptions:
    - nfsvers=3
    - hard
  nfs:
    server: 192.168.63.10
    path: /volume1/nfs-share/s3/
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data-nfs
  namespace: appl-s3
  labels:
    velero.io/exclude-from-backups: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Ti
  volumeName: s3-data-nfs
