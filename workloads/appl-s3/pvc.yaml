---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-data-nfs
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  mountOptions:
    - nfsvers=3
    - hard
  nfs:
    server: 192.168.63.10
    path: /volume1/nfs-share/s3/
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data-nfs
  namespace: appl-s3
  labels:
    backup.n8r.ch/skip: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Ti
  volumeName: s3-data-nfs
---
# Read-only, cached twin of s3-data-nfs for kopiur (kopiur.yaml).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-data-nfs-backup
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  mountOptions:
    - nfsvers=3
    - hard
    - ro
    - actimeo=30
  nfs:
    server: 192.168.63.10
    path: /volume1/nfs-share/s3/
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data-backup
  namespace: appl-s3
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Ti
  volumeName: s3-data-nfs-backup
