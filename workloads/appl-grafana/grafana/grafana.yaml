---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: appl-grafana
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://grafana.github.io/helm-charts
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 5m
  values:
    grafana.ini:
      database:
        type: mysql
        host: mariadb.appl-mariadb.svc.cluster.local:3306
        name: grafana
        user: grafana
      unified_alerting:
        enabled: true
        ha_listen_address: "${POD_IP}:9094"
        ha_peers: "grafana-headless:9094"
        ha_advertise_address: "${POD_IP}:9094"
        ha_peer_timeout: 60s
        ha_reconnect_timeout: 2m
      unified_alerting.screenshots:
        capture: true
      users:
        auto_assign_org: false
      feature_toggles:
        publicDashboards: true

    replicas: 2

    plugins:
      - victoriametrics-logs-datasource

    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1

    extraExposePorts:
      - name: alerting
        port: 9094
    headlessService: true
    envValueFrom:
      POD_IP:
        fieldRef:
          fieldPath: status.podIP

    imageRenderer:
      enabled: true

    admin:
      existingSecret: grafana-admin

    envFromSecret: grafana-env

    resources:
      limits:
        memory: 1Gi

    ingress:
      enabled: true
      ingressClassName: traefik
      path: /
      pathType: Prefix
      hosts:
        - grafana.n8r.ch
      tls:
        - hosts:
            - grafana.n8r.ch
