---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustdesk
  namespace: appl-rustdesk
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 10m
  uninstall:
    keepHistory: false
  values:
    controllers:
      rustdesk:
        strategy: Recreate
        containers:
          hbbs:
            image:
              repository: rustdesk/rustdesk-server-pro
              tag: "latest"
            args:
              - hbbs
              - -r
              - rustdesk.n8r.ch
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 21115
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 21115
                  initialDelaySeconds: 3
                  periodSeconds: 5
          hbbr:
            image:
              repository: rustdesk/rustdesk-server-pro
              tag: "latest"
            args:
              - hbbr
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 21117
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 21117
                  initialDelaySeconds: 3
                  periodSeconds: 5

    service:
      main:
        type: LoadBalancer
        controller: rustdesk
        annotations:
          # IPv6 = 21116 in hex (0x527C) — rustdesk's rendezvous port, self-documenting
          metallb.io/loadBalancerIPs: 192.168.63.237, 2001:1620:5386:cafe::527c
        ipFamilyPolicy: RequireDualStack
        ipFamilies:
          - IPv4
          - IPv6
        ports:
          # Pro: API + web console (proxied via Traefik ingress, not LB)
          api:
            enabled: true
            port: 21114
            targetPort: 21114
          nat-test:
            enabled: true
            port: 21115
            targetPort: 21115
          id-registration:
            enabled: true
            port: 21116
            targetPort: 21116
          id-registration-udp:
            enabled: true
            port: 21116
            protocol: UDP
            targetPort: 21116
          relay:
            enabled: true
            port: 21117
            targetPort: 21117
          # hbbs listens on 21118 and hbbr on 21119 for the web clients
          websocket-hbbs:
            enabled: true
            port: 21118
            targetPort: 21118
          websocket-hbbr:
            enabled: true
            port: 21119
            targetPort: 21119

    # Pro web console + API — plain HTTP inside the cluster, TLS terminated
    # by Traefik at rustdesk.n8r.ch (443 already DNATed on the router).
    ingress:
      main:
        enabled: true
        className: traefik
        hosts:
          - host: rustdesk.n8r.ch
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: api
        tls:
          - hosts:
              - rustdesk.n8r.ch

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        size: 1Gi
        accessMode: ReadWriteOnce
        retain: true # helm.sh/resource-policy: keep — PVC survives helm uninstall
        # /root holds the hbbs keypair (id_ed25519) and db_v2.sqlite3
        # (registered peer IDs + tags) — genuinely stateful.
        globalMounts:
          - path: /root

    podAnnotations:
      backup.velero.io/backup-volumes: data
