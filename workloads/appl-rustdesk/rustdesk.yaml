---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustdesk
  namespace: appl-rustdesk
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 10m
  uninstall:
    keepHistory: false
  values:
    controllers:
      rustdesk:
        # StatefulSet: stable pod name (rustdesk-0) — handy for a single
        # hostNetwork edge workload.
        type: statefulset
        pod:
          # Edge node (OCI VPS, no CNI): hostNetwork only, ports bind
          # directly on the public IPs.
          hostNetwork: true
          # ClusterFirst points at ClusterIP CoreDNS, unreachable without
          # CNI — use the node's resolver instead.
          dnsPolicy: Default
          nodeSelector:
            kubernetes.io/hostname: edge-oci-relay
          tolerations:
            - operator: Exists # tolerates all edge-node taints (n8r.ch/edge, not-ready, cilium-agent-not-ready)
        containers:
          hbbs:
            image:
              repository: rustdesk/rustdesk-server-pro
              tag: "latest"
            args:
              - hbbs
              - -r
              - rustdesk.n8r.ch
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 21115
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 21115
                  initialDelaySeconds: 3
                  periodSeconds: 5
          hbbr:
            image:
              repository: rustdesk/rustdesk-server-pro
              tag: "latest"
            args:
              - hbbr
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 21117
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 21117
                  initialDelaySeconds: 3
                  periodSeconds: 5

    persistence:
      data:
        enabled: true
        type: hostPath
        hostPath: /var/data/rustdesk
        # /root holds the hbbs keypair (id_ed25519) and db_v2.sqlite3
        # (registered peer IDs + tags).
        globalMounts:
          - path: /root