---
# vmbackup user on s3.n8r.ch (versitygw); access key = user name
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmbackup-s3
  namespace: metrics
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: vmbackup-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: vmbackup
        AWS_SECRET_ACCESS_KEY: "{{ .secret }}"
  data:
  - secretKey: secret
    remoteRef:
      key: k8s/appl-s3/users
      property: vmbackup
