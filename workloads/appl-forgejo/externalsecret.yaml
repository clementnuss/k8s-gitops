---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db
  namespace: appl-forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: forgejo-db
    creationPolicy: Owner
  dataFrom:
    # Expected keys: username, password
    - extract:
        key: k8s/appl-forgejo/forgejo-db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: appl-forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: forgejo-admin
    creationPolicy: Owner
  dataFrom:
    # Expected keys: username (not "admin", it's reserved), password
    - extract:
        key: k8s/appl-forgejo/forgejo-admin
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oauth
  namespace: appl-forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: forgejo-oauth
    creationPolicy: Owner
  dataFrom:
    # Expected keys: key (client ID), secret (client secret) of the Pocket ID client
    - extract:
        key: k8s/appl-forgejo/forgejo-oauth
