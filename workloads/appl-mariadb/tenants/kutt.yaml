apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: kutt
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  passwordSecretKeyRef:
    name: mariadb-passwords
    key: kutt
  maxUserConnections: 20
  host: "%"
  cleanupPolicy: Delete
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: grant-kutt
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL"
  database: "kutt"
  table: "*"
  username: kutt
  grantOption: true
  host: "%"
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: kutt
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  characterSet: utf8
  collate: utf8_general_ci
