apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: paperless-n8r
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  passwordSecretKeyRef:
    name: mariadb-passwords
    key: paperless-n8r
  maxUserConnections: 100
  host: "%"
  cleanupPolicy: Delete
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: grant-paperless-n8r
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL"
  database: "paperless-n8r"
  table: "*"
  username: paperless-n8r
  grantOption: true
  host: "%"
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: paperless-n8r
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
