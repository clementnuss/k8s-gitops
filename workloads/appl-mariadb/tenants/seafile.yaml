---
# Seafile Pro requires 3 databases (seafile_ccnet_db, seafile_db,
# seafile_seahub_db) and a dedicated MySQL user. The MariaDB operator
# provisions all of these declaratively. The password is stored in the
# shared mariadb-passwords secret (OpenBao path
# k8s/appl-mariadb/mariadb-passwords, key "seafile").
# spec.name overrides the SQL database name (defaults to metadata.name)
# to use the seafile_ prefix, making ownership clear in `SHOW DATABASES`.
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: seafile
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  passwordSecretKeyRef:
    name: mariadb-passwords
    key: seafile
  maxUserConnections: 100
  host: "%"
  cleanupPolicy: Delete
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: grant-seafile-ccnet
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL"
  database: "seafile_ccnet_db"
  table: "*"
  username: seafile
  grantOption: true
  host: "%"
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: grant-seafile-seafile
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL"
  database: "seafile_db"
  table: "*"
  username: seafile
  grantOption: true
  host: "%"
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: grant-seafile-seahub
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL"
  database: "seafile_seahub_db"
  table: "*"
  username: seafile
  grantOption: true
  host: "%"
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: ccnet-db
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  name: seafile_ccnet_db
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: seafile-db
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  name: seafile_db
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: seahub-db
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  name: seafile_seahub_db
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
