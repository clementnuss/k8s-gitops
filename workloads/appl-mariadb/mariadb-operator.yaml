---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: appl-mariadb
spec:
  interval: 5m
  chart:
    spec:
      chart: mariadb-operator
      version: 26.6.0
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
      interval: 5m
  values:
    logLevel: INFO
    ha:
      enabled: true
      replicas: 3
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
    webhook:
      serviceMonitor:
        enabled: false
    certController:
      serviceMonitor:
        enabled: false
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - mariadb-operator
            - key: app.kubernetes.io/instance
              operator: In
              values:
              - mariadb-operator
          topologyKey: kubernetes.io/hostname
    pdb:
      enabled: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: appl-mariadb
spec:
  interval: 5m
  chart:
    spec:
      chart: mariadb-operator-crds
      version: 26.6.0
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
      interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.mariadb.com/mariadb-operator
