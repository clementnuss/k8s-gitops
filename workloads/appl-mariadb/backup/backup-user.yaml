apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: backup
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  passwordSecretKeyRef:
    name: mariadb-passwords
    key: backup
  maxUserConnections: 20
  host: "%"
  cleanupPolicy: Delete
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: grant-backup
  namespace: appl-mariadb
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - SELECT
    - RELOAD
    - PROCESS
    - SUPER
    - LOCK TABLES
    - REPLICATION CLIENT
    - SHOW VIEW
  database: "*"
  table: "*"
  username: backup
  # grantOption: true
  host: "%"
