---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: goatcounter-secret
  namespace: appl-goat-counter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: goatcounter-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Assemble the GoatCounter DB connection string from the same
        # username/password stored for the CNPG managed role "goatcounter"
        # on the shared postgres-cnpg cluster.
        # CNPG rw service: postgres-cnpg-rw.appl-postgres.svc:5432
        GOATCOUNTER_DB: "postgresql+postgresql://{{ .username }}:{{ .password }}@postgres-cnpg-rw.appl-postgres.svc.cluster.local:5432/goatcounter?sslmode=disable"
  dataFrom:
  - extract:
      key: k8s/appl-goat-counter/goatcounter-db-secret