---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: appl-n8r
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://oauth2-proxy.github.io/manifests
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy-charts
        namespace: flux-system
      interval: 5m
  values:
    replicaCount: 1

    ingress:
      enabled: true
      className: traefik
      path: /oauth2
      hosts:
        - auth.n8r.ch
      tls:
        - hosts:
            - auth.n8r.ch

    config:
      # Use the ESO-managed secret directly. The chart reads
      # client-id, client-secret, cookie-secret from it
      # (see config.requiredSecretKeys). client-secret is pulled
      # from the dex secret by the ExternalSecret to avoid duplication.
      existingSecret: oauth2-proxy-secrets
      # With alphaConfig enabled, the chart generates a minimal legacy
      # config containing only email_domains. All other settings live
      # in the alpha config below.
      forceLegacyConfig: false

    alphaConfig:
      enabled: true
      configData:
        # Provider — moved from extraArgs (provider, oidc-issuer-url, prompt).
        # In alpha config these are structured under providers[].
        # clientID/clientSecret are injected as env vars by the chart
        # (OAUTH2_PROXY_CLIENT_ID etc) from the existingSecret.
        providers:
          - id: pocket-id
            provider: oidc
            name: Pocket ID
            # In alpha config, clientID/clientSecret must be set in the
            # providers block. The chart injects OAUTH2_PROXY_CLIENT_ID,
            # OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET as env
            # vars from existingSecret — reference them here via ${...}.
            clientID: ${OAUTH2_PROXY_CLIENT_ID}
            clientSecret: ${OAUTH2_PROXY_CLIENT_SECRET}
            oidcConfig:
              issuerURL: https://id.n8r.ch
              # Pocket ID doesn't set email_verified=true for admin-created
              # users. Since we control who's in Pocket ID, trust the email
              # claim without verification.
              insecureAllowUnverifiedEmail: true
            additionalClaims:
              - name
              - given_name
              - family_name
            # prompt=none moved here from extraArgs (prompt is a removed
            # option in alpha config).
            loginURLParameters:
              - name: prompt
                default:
                  - none

        # Upstream — moved from configFile (upstreams = [ "file:///dev/null" ]).
        # In alpha config, upstreams are structured.
        upstreamConfig:
          upstreams:
            - id: noop
              path: /
              uri: file:///dev/null

        # Response headers — replaces --set-xauthrequest (removed in alpha
        # config) and adds X-Auth-Request-Name for the user's display name.
        # These are injected on the /oauth2/auth response and picked up by
        # Traefik's forwardAuth middleware.
        injectResponseHeaders:
          - name: X-Auth-Request-User
            values:
              - claimSource:
                  claim: user
          - name: X-Auth-Request-Email
            values:
              - claimSource:
                  claim: email
          - name: X-Auth-Request-Preferred-Username
            values:
              - claimSource:
                  claim: preferred_username
          - name: X-Auth-Request-Groups
            values:
              - claimSource:
                  claim: groups
          - name: X-Auth-Request-Name
            values:
              - claimSource:
                  claim: name

    extraArgs:
      # These flags are NOT in the alpha-config removed list and stay as
      # extraArgs alongside --alpha-config.
      skip-provider-button: true
      cookie-domain: .n8r.ch
      whitelist-domain: .n8r.ch
      email-domain: "*"
      # Pin the OAuth redirect_uri so it's always auth.n8r.ch regardless of
      # the incoming Host header. Required for the Traefik `errors`-middleware
      # pattern, where Traefik calls oauth2-proxy server-side with the
      # original request's Host (e.g. logs.n8r.ch) — without this, oauth2-proxy
      # would build redirect_uri from that Host and the IdP would reject it.
      redirect-url: "https://auth.n8r.ch/oauth2/callback"
