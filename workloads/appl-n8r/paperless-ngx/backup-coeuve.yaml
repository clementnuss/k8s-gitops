---
# Independent Kopia backup of paperless-ngx to syno-coeuve over WebDAV.
# This is a SECOND backup, independent of the nuss-roy backup
# (backup-nuss-roy.yaml). If one repo is corrupted or compromised,
# the other is unaffected.
#
# Snapshots the paperless-ngx-export PVC (populated by the paperless-export
# CronJob at 02:00 Zurich). Pure read-only kopia snapshot - no kubectl,
# no SA. Schedules on the same node as paperless-ngx because the export
# PVC is ReadWriteOnce.
#
# Secrets:
#   paperless-kopia     - KOPIA_REPO_PATH + KOPIA_PASSWORD (per-repo, OpenBao)
#   webdav-syno-coeuve  - KOPIA_WEBDAV_URL/USER/PASS (shared endpoint, OpenBao)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-backup-coeuve
  namespace: appl-n8r
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Zurich
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: paperless-ngx
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: kopia
              image: kopia/kopia:0.23.1
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  DST_URL="${KOPIA_WEBDAV_URL%/}/${KOPIA_REPO_PATH}"

                  echo "=== Connecting to (or creating) destination repository: $DST_URL ==="
                  kopia repository connect webdav \
                    --url="$DST_URL" \
                    --webdav-username="$KOPIA_WEBDAV_USER" \
                    --webdav-password="$KOPIA_WEBDAV_PASS" \
                    --override-username=paperless \
                    --override-hostname=planchettes63 || \
                  kopia repository create webdav \
                    --url="$DST_URL" \
                    --webdav-username="$KOPIA_WEBDAV_USER" \
                    --webdav-password="$KOPIA_WEBDAV_PASS"

                  echo "=== Creating snapshot of /export ==="
                  kopia snapshot create /export

                  echo "=== Snapshots ==="
                  kopia snapshot list --all

                  kopia repository disconnect
                  echo "=== Done ==="
              envFrom:
                # Per-repo: KOPIA_REPO_PATH + KOPIA_PASSWORD.
                - secretRef:
                    name: paperless-kopia
              env:
                # Endpoint creds (shared webdav-syno-coeuve).
                - name: KOPIA_WEBDAV_URL
                  valueFrom:
                    secretKeyRef:
                      name: webdav-syno-coeuve
                      key: KOPIA_WEBDAV_URL
                - name: KOPIA_WEBDAV_USER
                  valueFrom:
                    secretKeyRef:
                      name: webdav-syno-coeuve
                      key: KOPIA_WEBDAV_USER
                - name: KOPIA_WEBDAV_PASS
                  valueFrom:
                    secretKeyRef:
                      name: webdav-syno-coeuve
                      key: KOPIA_WEBDAV_PASS
              volumeMounts:
                - name: export
                  mountPath: /export
                  readOnly: true
                - name: kopia-cache
                  mountPath: /root/.cache/kopia
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: export
              persistentVolumeClaim:
                claimName: paperless-ngx-export
            - name: kopia-cache
              emptyDir: {}
---
# Weekly deep verification of the paperless coeuve backup repository.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-verify-coeuve
  namespace: appl-n8r
spec:
  schedule: "0 4 * * 0"
  timeZone: Europe/Zurich
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: kopia
              image: kopia/kopia:0.23.1
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  DST_URL="${KOPIA_WEBDAV_URL%/}/${KOPIA_REPO_PATH}"

                  echo "=== Connecting to destination for verification: $DST_URL ==="
                  kopia repository connect webdav \
                    --url="$DST_URL" \
                    --webdav-username="$KOPIA_WEBDAV_USER" \
                    --webdav-password="$KOPIA_WEBDAV_PASS"

                  echo "=== Verifying all snapshots (downloads and hashes every block) ==="
                  kopia snapshot verify --all-snapshots

                  kopia repository disconnect
                  echo "=== Verification complete ==="
              envFrom:
                # Per-repo: KOPIA_REPO_PATH + KOPIA_PASSWORD.
                - secretRef:
                    name: paperless-kopia
              env:
                # Endpoint creds (shared webdav-syno-coeuve).
                - name: KOPIA_WEBDAV_URL
                  valueFrom:
                    secretKeyRef:
                      name: webdav-syno-coeuve
                      key: KOPIA_WEBDAV_URL
                - name: KOPIA_WEBDAV_USER
                  valueFrom:
                    secretKeyRef:
                      name: webdav-syno-coeuve
                      key: KOPIA_WEBDAV_USER
                - name: KOPIA_WEBDAV_PASS
                  valueFrom:
                    secretKeyRef:
                      name: webdav-syno-coeuve
                      key: KOPIA_WEBDAV_PASS
              volumeMounts:
                - name: kopia-cache
                  mountPath: /root/.cache/kopia
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: kopia-cache
              emptyDir: {}