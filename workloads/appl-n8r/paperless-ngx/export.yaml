---
# Runs document_exporter inside the paperless pod into the
# paperless-ngx-export PVC: a consistent, self-contained copy (the DB lives
# in mariadb). Picked up by the kopiur backup (appl-n8r/kopiur.yaml),
# which must run after this: 02:00 Zurich here vs. 03:00-04:30 Zurich there.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-export
  namespace: appl-n8r
spec:
  schedule: "0 2 * * *"
  timeZone: Europe/Zurich
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: paperless-backup
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: paperless-ngx
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: document-exporter
              image: alpine/k8s:1.37.2
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  POD=$(kubectl get pods -n appl-n8r -l app.kubernetes.io/name=paperless-ngx -o jsonpath='{.items[0].metadata.name}')
                  if [ -z "$POD" ]; then
                    echo "ERROR: paperless-ngx pod not found"
                    exit 1
                  fi
                  echo "Running document_exporter in pod $POD"
                  kubectl exec -n appl-n8r "$POD" -c app -- \
                    document_exporter /usr/src/paperless/export \
                      --delete \
                      --use-folder-prefix \
                      --split-manifest \
                      --compare-checksums \
                      --no-archive \
                      --no-thumbnail
                  echo "=== Export complete ==="
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperless-backup
  namespace: appl-n8r
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperless-backup
  namespace: appl-n8r
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperless-backup
  namespace: appl-n8r
subjects:
  - kind: ServiceAccount
    name: paperless-backup
    namespace: appl-n8r
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paperless-backup