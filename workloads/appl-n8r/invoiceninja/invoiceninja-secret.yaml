---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoiceninja-env
  namespace: appl-n8r
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: invoiceninja-env
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: k8s/appl-n8r/invoiceninja-env
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: k8s/appl-mariadb/mariadb-passwords
        property: invoiceninja-n8r
