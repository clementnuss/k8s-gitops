# kopiur: Longhorn PVCs -> kopia-main. Same in every namespace; see infra/kopiur/README.md.
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: kopia-main
  namespace: appl-n8r
spec:
  repository:
    kind: ClusterRepository
    name: kopia-main
  credentialProjection:
    enabled: true
  # read-only root mover: volumes mix owners and 0600 files
  mover:
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
    privilegedMode: true
  # longhorn has no VolumeGroupSnapshotClass
  groupBy: None
  sources:
    - pvcSelector:
        labelSelector:
          matchExpressions:
            - key: backup.n8r.ch/skip
              operator: DoesNotExist
            # kopiur's own cache PVCs (immich, kopia-nas)
            - key: app.kubernetes.io/managed-by
              operator: NotIn
              values: [kopiur]
  retention:
    keepDaily: 14
    keepWeekly: 4
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: kopia-main-nightly
  namespace: appl-n8r
spec:
  policyRef:
    name: kopia-main
  # after paperless-export (02:00 Zurich)
  schedule:
    cron: "H 3 * * *"
    timezone: Europe/Zurich
    jitter: 30m
---
# kopiur: NAS folder -> kopia-nas (Backblaze, replicated to coeuve). Read-only
# cached NFS PV mounted Direct, like immich (the kopiur nfs source didn't work).
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: kopia-nas
  namespace: appl-n8r
spec:
  repository:
    kind: ClusterRepository
    name: kopia-nas
  credentialProjection:
    enabled: true
  # NAS files are root-owned
  mover:
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
    privilegedMode: true
    cache:
      mode: Persistent
      capacity: 2Gi
      storageClassName: longhorn-2-replicas
  copyMethod: Direct
  sources:
    - pvc:
        name: navidrome-music
  retention:
    keepDaily: 14
    keepWeekly: 8
    keepMonthly: 12
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: kopia-nas-nightly
  namespace: appl-n8r
spec:
  policyRef:
    name: kopia-nas
  schedule:
    cron: "H 1 * * *"
    timezone: Europe/Zurich
    jitter: 30m
