# kopiur fleet backup: every PVC in the namespace is snapshotted into the
# shared kopia-main ClusterRepository, EXCEPT velero.io/exclude-from-backups=true
# and kopiur-managed objects (mover cache PVCs).
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: kopia-main
  namespace: appl-n8r
spec:
  repository:
    kind: ClusterRepository
    name: kopia-main
  # project repo credential secrets into mover jobs (no per-ns secrets needed)
  credentialProjection:
    enabled: true
  # movers run as root + DAC_OVERRIDE: fleet PVCs have heterogeneous owners
  # (homeassistant .storage is 0600 root); non-root mover can't read them
  mover:
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
    privilegedMode: true
  sources:
    - pvcSelector:
        labelSelector:
          matchExpressions:
            - key: velero.io/exclude-from-backups
              operator: DoesNotExist
            - key: app.kubernetes.io/managed-by
              value: kopiur
              operator: DoesNotExist
  retention:
    keepDaily: 14
    keepWeekly: 4
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: kopia-main-nightly
  namespace: appl-n8r
spec:
  policyRef:
    name: kopia-main
  schedule:
    cron: "H 2 * * *"
    jitter: 30m
