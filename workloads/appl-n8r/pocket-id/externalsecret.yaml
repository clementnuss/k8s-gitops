---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-secret
  namespace: appl-n8r
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pocket-id-secret
    creationPolicy: Owner
  dataFrom:
    # Extracts all keys from secret/k8s/appl-n8r/pocket-id in OpenBao.
    # Expected key:
    #   ENCRYPTION_KEY  - base64, 32 bytes (openssl rand -base64 32)
    - extract:
        key: k8s/appl-n8r/pocket-id