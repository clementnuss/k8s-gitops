---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
  namespace: appl-n8r
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 10m
  uninstall:
    keepHistory: false
  values:
    controllers:
      pocket-id:
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.14.0
            env:
              APP_URL: "https://id.n8r.ch"
              TRUST_PROXY: "true"
              # ENCRYPTION_KEY injected from pocket-id-secret via envFrom.
            envFrom:
              - secretRef:
                  name: pocket-id-secret
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      main:
        type: ClusterIP
        controller: pocket-id
        ports:
          http:
            port: 1411

    ingress:
      main:
        enabled: true
        className: traefik
        hosts:
          - host: id.n8r.ch
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - id.n8r.ch

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/data

    podAnnotations:
      backup.velero.io/backup-volumes: data