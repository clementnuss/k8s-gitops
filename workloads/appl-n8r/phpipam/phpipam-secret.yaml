---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phpipam-env
  namespace: appl-n8r
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: phpipam-env
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
  - extract:
      key: k8s/appl-n8r/phpipam-env
  data:
  - secretKey: IPAM_DATABASE_PASS
    remoteRef:
      key: k8s/appl-mariadb/mariadb-passwords
      property: phpipam
