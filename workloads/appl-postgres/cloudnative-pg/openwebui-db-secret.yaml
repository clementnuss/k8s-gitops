---
# Password secret for the CNPG-managed `openwebui` role.
# Pulls username/password from the same OpenBao entry that composes
# DATABASE_URL in appl-llm (k8s/appl-llm/openwebui-db).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-db-secret
  namespace: appl-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openwebui-db-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    # Expected keys: username, password
    - extract:
        key: k8s/appl-llm/openwebui-db