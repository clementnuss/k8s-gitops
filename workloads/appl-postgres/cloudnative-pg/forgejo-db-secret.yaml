---
# Password for the CNPG-managed `forgejo` role; same OpenBao entry as
# appl-forgejo/externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db-secret
  namespace: appl-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: forgejo-db-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    # Expected keys: username (forgejo), password
    - extract:
        key: k8s/appl-forgejo/forgejo-db
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: forgejo
  namespace: appl-postgres
spec:
  name: forgejo
  owner: forgejo
  cluster:
    name: postgres-cnpg
