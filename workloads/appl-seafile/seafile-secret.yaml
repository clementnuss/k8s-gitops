---
# OpenBao: k8s/appl-seafile/seafile-secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seafile-secret
  namespace: appl-seafile
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seafile-secret
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: k8s/appl-seafile/seafile-secret
  data:
    - secretKey: SEAFILE_MYSQL_DB_PASSWORD
      remoteRef:
        key: k8s/appl-mariadb/mariadb-passwords
        property: seafile-n8r