---
# Frozen backup of pre-migration state. Safe to delete once NFS is confirmed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-shared
  namespace: appl-seafile
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-2-replicas
  resources:
    requests:
      storage: 10Gi
---
# NFS PV for /shared/seafile.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seafile-data-nfs
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  mountOptions:
    - nfsvers=3
    - hard
    - noac
    - lookupcache=none
  nfs:
    server: 192.168.63.10
    path: /volume1/nfs-share/seafile/
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-data-nfs
  namespace: appl-seafile
  labels:
    backup.n8r.ch/skip: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Ti
  volumeName: seafile-data-nfs---
# Read-only, cached twin of seafile-data-nfs for kopiur (kopiur.yaml).
# The live PV needs noac for seafile; the backup can tolerate 30s staleness.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seafile-data-nfs-backup
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  mountOptions:
    - nfsvers=3
    - hard
    - ro
    - actimeo=30
  nfs:
    server: 192.168.63.10
    path: /volume1/nfs-share/seafile/
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-data-backup
  namespace: appl-seafile
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Ti
  volumeName: seafile-data-nfs-backup
