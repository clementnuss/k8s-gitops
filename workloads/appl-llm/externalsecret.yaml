---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-secret
  namespace: appl-llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openwebui-secret
    creationPolicy: Owner
    template:
      data:
        OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        WEBUI_SECRET_KEY: "{{ .WEBUI_SECRET_KEY }}"
        # Open WebUI reads the OpenAI-compatible connection key from
        # OPENAI_API_KEY — rename the OpenBao key (OLLAMA_API_KEY).
        OPENAI_API_KEY: "{{ .OLLAMA_API_KEY }}"
  dataFrom:
    # Extracts all keys from secret/k8s/appl-llm/openwebui in OpenBao.
    # Expected keys:
    #   OAUTH_CLIENT_SECRET  - Pocket ID OIDC client secret
    #   WEBUI_SECRET_KEY     - session signing key (openssl rand -hex 32)
    #   OLLAMA_API_KEY       - Ollama Cloud API key (ollama.com Settings > Keys)
    - extract:
        key: k8s/appl-llm/openwebui